<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>TTP診断 | TTPアカデミー</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  :root{
    --blue:#1E9BE0; --amber:#FFB020; --green:#35C759;
    --ink:#1c2733; --muted:#6b7a89; --bg:#f4f7fa; --card:#ffffff;
    --radius:22px;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;
    background:var(--bg); color:var(--ink); font-weight:700;
    display:flex; justify-content:center;
  }
  #app{width:100%; max-width:480px; min-height:100dvh; display:flex; flex-direction:column; position:relative; overflow:hidden}

  /* ===== progress ===== */
  #progressWrap{padding:18px 20px 6px; display:none}
  #progressMeta{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px}
  #progressCount{font-size:15px; color:var(--muted); letter-spacing:.06em}
  #progressCount b{font-size:22px; color:var(--ink)}
  #progressLabel{font-size:12px; color:var(--muted)}
  #barOuter{height:14px; background:#e3ebf2; border-radius:99px; position:relative}
  #barInner{height:100%; width:0%; border-radius:99px;
    background:linear-gradient(90deg,var(--blue),var(--green) 55%,var(--amber));
    transition:width .5s cubic-bezier(.22,1,.36,1)}
  #barChameleon{position:absolute; top:-21px; width:34px; height:34px; object-fit:contain;
    transition:left .5s cubic-bezier(.22,1,.36,1); transform:translateX(-50%)}
  #barChameleon.dance{animation:dance .5s ease}
  @keyframes dance{
    0%{transform:translateX(-50%) translateY(0) rotate(0deg)}
    25%{transform:translateX(-50%) translateY(-13px) rotate(-9deg)}
    55%{transform:translateX(-50%) translateY(0) rotate(8deg)}
    80%{transform:translateX(-50%) translateY(-7px) rotate(-4deg)}
    100%{transform:translateX(-50%) translateY(0) rotate(0deg)}
  }

  /* ===== screens ===== */
  .screen{display:none; flex:1; flex-direction:column; padding:10px 20px 28px; animation:fadein .3s ease}
  .screen.active{display:flex}
  @keyframes fadein{from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none}}

  /* start */
  #startScreen{align-items:center; text-align:center; justify-content:center; gap:0}
  .brandTag{font-size:12px; letter-spacing:.18em; color:var(--blue); margin-bottom:10px}
  #startScreen h1{font-size:34px; line-height:1.25; margin-bottom:10px}
  #startScreen h1 .hl-blue{color:var(--blue)} #startScreen h1 .hl-amber{color:var(--amber)}
  #startScreen p.sub{font-size:14px; color:var(--muted); font-weight:500; line-height:1.7; margin-bottom:22px}
  #startChameleon{width:170px; height:170px; object-fit:contain; animation:bob 2.6s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
  .startMeta{display:flex; gap:8px; margin:20px 0 26px}
  .startMeta span{background:var(--card); border:2px solid #e3ebf2; border-radius:99px; padding:7px 14px; font-size:13px}
  .bigBtn{
    background:var(--blue); color:#fff; border:none; border-radius:99px;
    font-size:18px; font-weight:800; padding:17px 44px; cursor:pointer;
    box-shadow:0 8px 20px rgba(30,155,224,.35); font-family:inherit;
    transition:transform .12s ease, box-shadow .12s ease; width:100%; max-width:320px;
  }
  .bigBtn:active{transform:scale(.96); box-shadow:0 3px 8px rgba(30,155,224,.3)}

  /* question */
  #qCategory{font-size:12px; letter-spacing:.14em; color:var(--blue); margin:14px 0 6px}
  #qText{font-size:23px; line-height:1.45; margin-bottom:22px; min-height:2.9em}
  .opt{
    display:block; width:100%; text-align:left; background:var(--card);
    border:2.5px solid #e3ebf2; border-radius:var(--radius);
    padding:17px 18px; font-size:16.5px; font-weight:700; color:var(--ink);
    margin-bottom:11px; cursor:pointer; font-family:inherit; position:relative;
    transition:border-color .15s, background .15s, transform .1s;
  }
  .opt:active{transform:scale(.985)}
  .opt.selected{border-color:var(--blue); background:#eaf6fd}
  .opt.selected::after{
    content:""; position:absolute; right:16px; top:50%; width:12px; height:12px;
    transform:translateY(-50%); border-radius:50%; background:var(--green);
  }
  #backBtn{margin-top:auto; align-self:flex-start; background:none; border:none; color:var(--muted);
    font-size:14px; font-weight:700; cursor:pointer; padding:10px 4px; font-family:inherit; visibility:hidden}

  /* result */
  #resultScreen{align-items:center; text-align:center}
  .resultKicker{font-size:12px; letter-spacing:.16em; color:var(--muted); margin:16px 0 4px}
  #resultType{font-size:30px; line-height:1.35; margin-bottom:6px}
  #resultType .typeName{color:var(--blue)}
  #scoreWrap{margin:16px 0 4px}
  #scoreNum{font-size:64px; line-height:1; background:linear-gradient(90deg,var(--blue),var(--green),var(--amber));
    -webkit-background-clip:text; background-clip:text; color:transparent}
  #scoreLabel{font-size:13px; color:var(--muted); margin-top:6px; letter-spacing:.1em}
  #resultChamWrap{position:relative; width:190px; height:190px; margin:10px 0 4px}
  #resultChamWrap .blob{position:absolute; border-radius:50%; filter:blur(2px); opacity:.55}
  #resultChamWrap .b1{width:120px;height:120px;background:var(--blue); left:6px; top:38px}
  #resultChamWrap .b2{width:120px;height:120px;background:var(--amber); right:6px; top:38px; mix-blend-mode:multiply}
  #resultChameleon{position:absolute; inset:0; margin:auto; width:165px; height:165px; object-fit:contain; animation:bob 2.6s ease-in-out infinite}
  #resultDesc{background:var(--card); border-radius:var(--radius); padding:18px; font-size:14.5px;
    font-weight:500; line-height:1.85; text-align:left; margin:14px 0 20px; border:2px solid #e3ebf2}
  #resultNote{font-size:12.5px; color:var(--muted); font-weight:500; line-height:1.7; margin-bottom:18px}
  #closeBtn{display:none}

  /* sparkles */
  .spark{position:fixed; width:13px; height:13px; pointer-events:none; z-index:60;
    clip-path:polygon(50% 0%,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0% 50%,38% 38%);
    animation:sparkfly .65s ease-out forwards}
  @keyframes sparkfly{
    from{opacity:1; transform:translate(0,0) rotate(0deg) scale(1)}
    to{opacity:0; transform:translate(var(--dx),var(--dy)) rotate(160deg) scale(.35)}
  }
</style>
</head>
<body>
<div id="app">

  <div id="progressWrap">
    <div id="progressMeta">
      <div id="progressCount"><b id="curNum">1</b> / <span id="totalNum">8</span></div>
      <div id="progressLabel">TTP診断</div>
    </div>
    <div id="barOuter">
      <div id="barInner"></div>
      <img id="barChameleon" src="chameleon.png" alt="">
    </div>
  </div>

  <!-- START -->
  <section id="startScreen" class="screen active">
    <div class="brandTag">TTPアカデミー</div>
    <h1>TTP<span class="hl-blue">診断</span></h1>
    <p class="sub">8つの質問にタップで答えるだけ。<br>あなたが「最初にパクるべき型」と<br>ジェネスペ度がわかります。</p>
    <img id="startChameleon" src="chameleon.png" alt="TTPアカデミーのカメレオン">
    <div class="startMeta"><span>全8問</span><span>約1分</span><span>タップだけ</span></div>
    <button class="bigBtn" id="startBtn">診断をはじめる</button>
  </section>

  <!-- QUESTION -->
  <section id="qScreen" class="screen">
    <div id="qCategory"></div>
    <div id="qText"></div>
    <div id="optWrap"></div>
    <button id="backBtn">← もどる</button>
  </section>

  <!-- RESULT -->
  <section id="resultScreen" class="screen">
    <div class="resultKicker">診断結果</div>
    <div id="resultType">あなたが最初に<br>パクるべき型は<span class="typeName" id="typeName"></span></div>
    <div id="resultChamWrap">
      <div class="blob b1"></div><div class="blob b2"></div>
      <img id="resultChameleon" src="chameleon.png" alt="">
    </div>
    <div id="scoreWrap">
      <div id="scoreNum">0</div>
      <div id="scoreLabel">ジェネスペ度（スキル×スキルの掛け合わせ）</div>
    </div>
    <div id="resultDesc"></div>
    <p id="resultNote">結果に合わせた「型の仕入れ方」は、公式LINEのミニ講座とウェビナーでお渡しします。この画面を閉じて、LINEのトークに戻ってください。</p>
    <button class="bigBtn" id="closeBtn">LINEに戻る</button>
  </section>

</div>

<script>
const FORM_ID = new URLSearchParams(location.search).get('formId') || '0c91e91e-7074-4d4a-a25e-a383aa7d40ad';
const API_BASE = 'https://be1bbfc793e8.lharness.cloud';
const LIFF_ID = '2012297605-EWdpHad2';

const QUESTIONS = [
  {field:'stage', cat:'あなたの現在地', text:'今のあなたに一番近いのは？',
   options:['会社員・副業はこれから','副業を始めたばかり','副業で少し稼いだことがある','フリーランス・個人事業主']},
  {field:'bottleneck', cat:'詰まっているところ', text:'副業でいちばん止まっているのは？',
   options:['何をやればいいか決まらない','集客できない','売れない・提案が通らない','作るのに時間がかかる','続かない・習慣化しない']},
  {field:'skill_have', cat:'持っているスキル', text:'今いちばん自信のあるスキルは？',
   options:['営業・接客','SNS・発信','文章・デザイン・動画などの制作','数字・分析・仕組み化','特にない']},
  {field:'skill_want', cat:'身につけたいスキル', text:'次に身につけたいのは？',
   options:['集客','販売','制作','設計（仕組み化）','継続の仕組み','まだわからない']},
  {field:'ai_level', cat:'AIの使い方', text:'AIの使い方の現在地は？',
   options:['ほとんど使っていない','チャットで質問する程度','仕事や副業で実務に使っている','AIで自動化までしている']},
  {field:'time_side', cat:'使える時間', text:'副業に使える時間は週どれくらい？',
   options:['3時間未満','3〜7時間','7〜15時間','15時間以上']},
  {field:'goal', cat:'目指すところ', text:'目指すところは？',
   options:['まず月1〜5万円','月10万円前後を安定させたい','本業の収入を超えたい','まだ決まっていない']},
  {field:'time_study', cat:'学びの時間', text:'勉強・インプットに使っている、または使えそうな時間は週どれくらい？',
   options:['ほぼゼロ','2時間未満','2〜5時間','5時間以上']},
];

const TYPE_BY_BOTTLENECK = ['設計','集客','販売','制作','継続'];
const TYPE_DESC = {
  '設計':'「何をやるか」が決まらないのは、意志の問題ではなく順番の問題です。最初にパクるべきは、うまくいっている人の「全体の組み立て方」。目的を1行で置いて、逆算で手順を並べる型から始めるのが近道です。',
  '集客':'「作れるのに届かない」状態です。パクるべきは、届けている人の「入口の作り方」。誰に・どの言葉で・どこで見せるか、その型を仕入れるのが先です。',
  '販売':'興味を持たれても、最後の一歩で止まってしまうタイプです。パクるべきは「提案の型」。相手の困りごとを聞き出す順番と、提示の組み立て方を仕入れると変わります。',
  '制作':'品質にこだわるほど時間が溶けてしまうタイプです。パクるべきは「速く作る型」。完成の基準と、AIに任せる部分の切り分け方を仕入れるのが先です。',
  '継続':'始める力はあるのに、続ける段で止まってしまうタイプです。パクるべきは「続く仕組みの型」。やる気ではなく、時間と手順を先に固定する設計を仕入れましょう。',
};
const HAVE_DOMAIN = ['販売','集客','制作','設計', null];
const WANT_DOMAIN = ['集客','販売','制作','設計','継続', null];

let idx = 0;
const answers = {};      // field -> option string (Harnessフォームの選択肢と完全一致させる)
const answerIdx = {};    // field -> option index
let liffReady = false;

const $ = id => document.getElementById(id);
['barChameleon','startChameleon','resultChameleon'].forEach(id=>{ const el=$(id); if(el) el.src = CHAM_IMG; });
function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  $(id).classList.add('active');
}
function setProgress(doneCount){
  const pct = (doneCount / QUESTIONS.length) * 100;
  $('barInner').style.width = pct + '%';
  $('barChameleon').style.left = pct + '%';
}
function renderQuestion(){
  const q = QUESTIONS[idx];
  $('curNum').textContent = idx + 1;
  $('totalNum').textContent = QUESTIONS.length;
  setProgress(idx);
  $('qCategory').textContent = q.cat;
  $('qText').textContent = q.text;
  const wrap = $('optWrap'); wrap.innerHTML = '';
  q.options.forEach((opt, i)=>{
    const b = document.createElement('button');
    b.className = 'opt' + (answerIdx[q.field] === i ? ' selected' : '');
    b.textContent = opt;
    b.addEventListener('click', ev => choose(i, ev));
    wrap.appendChild(b);
  });
  $('backBtn').style.visibility = idx > 0 ? 'visible' : 'hidden';
  show('qScreen');
}
function sparkle(x, y){
  const colors = ['#1E9BE0','#FFB020','#35C759'];
  for(let i=0;i<9;i++){
    const s = document.createElement('div');
    s.className = 'spark';
    s.style.background = colors[i % 3];
    s.style.left = x + 'px'; s.style.top = y + 'px';
    const ang = Math.random() * Math.PI * 2, dist = 46 + Math.random() * 60;
    s.style.setProperty('--dx', Math.cos(ang) * dist + 'px');
    s.style.setProperty('--dy', Math.sin(ang) * dist - 24 + 'px');
    document.body.appendChild(s);
    setTimeout(()=>s.remove(), 700);
  }
}
function choose(i, ev){
  const q = QUESTIONS[idx];
  answers[q.field] = q.options[i];
  answerIdx[q.field] = i;
  document.querySelectorAll('.opt').forEach((el, j)=>el.classList.toggle('selected', j === i));
  const cham = $('barChameleon');
  cham.classList.remove('dance'); void cham.offsetWidth; cham.classList.add('dance');
  if(ev) sparkle(ev.clientX || innerWidth/2, ev.clientY || 200);
  setProgress(idx + 1);
  setTimeout(()=>{
    if(idx < QUESTIONS.length - 1){ idx++; renderQuestion(); }
    else { showResult(); }
  }, 480);
}
function calcScore(){
  let s = 20;
  s += [0,5,10,15][answerIdx.stage] || 0;
  s += answerIdx.skill_have === 4 ? 0 : 20;
  const have = HAVE_DOMAIN[answerIdx.skill_have];
  const want = WANT_DOMAIN[answerIdx.skill_want];
  if(answerIdx.skill_want === 5) s += 0;
  else if(have === null) s += 10;
  else if(have === want) s += 10;
  else s += 20;
  s += [0,10,15,25][answerIdx.ai_level] || 0;
  return Math.min(100, s);
}
function showResult(){
  $('progressWrap').style.display = 'none';
  const type = TYPE_BY_BOTTLENECK[answerIdx.bottleneck];
  const score = calcScore();
  $('typeName').textContent = '『' + type + '』';
  $('resultDesc').textContent = TYPE_DESC[type];
  show('resultScreen');
  if(liffReady && window.liff && liff.isInClient()) $('closeBtn').style.display = 'block';
  const el = $('scoreNum'); const t0 = performance.now();
  (function tick(t){
    const p = Math.min(1, (t - t0) / 950);
    el.textContent = Math.round(score * (1 - Math.pow(1 - p, 3)));
    if(p < 1) requestAnimationFrame(tick);
  })(t0);
  submitAnswers();
}
async function submitAnswers(){
  try{
    if(!liffReady || !window.liff || !liff.isLoggedIn()) return;
    const profile = await liff.getProfile();
    await fetch(API_BASE + '/api/forms/' + FORM_ID + '/submit', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ lineUserId: profile.userId, data: answers }),
    });
  }catch(e){ /* 送信に失敗しても結果表示は妨げない */ }
}

$('startBtn').addEventListener('click', ()=>{
  $('progressWrap').style.display = 'block';
  idx = 0; renderQuestion();
});
$('backBtn').addEventListener('click', ()=>{ if(idx > 0){ idx--; renderQuestion(); } });
$('closeBtn').addEventListener('click', ()=>{ if(window.liff) liff.closeWindow(); });

(async ()=>{ try{ await liff.init({ liffId: LIFF_ID }); liffReady = true; }catch(e){} })();
</script>
</body>
</html>
